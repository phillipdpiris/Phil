name: Build SnoopGuard APK

on:
  push:
    branches: [ main, master, claude/android-privacy-app-ideas-rr9sia ]
    paths:
      - 'SnoopGuardApp/**'
      - '.github/workflows/build-snoopguard-apk.yml'
  pull_request:
    paths:
      - 'SnoopGuardApp/**'
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the obsolete "tools"
          # package, which Google removed from the SDK repo (sdkmanager then
          # fails with "Failed to find package 'tools'"). List only current
          # packages explicitly.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make gradlew executable
        working-directory: SnoopGuardApp
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: SnoopGuardApp
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: SnoopGuardApp
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snoopguard-debug-apk
          path: SnoopGuardApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo '## ✅ SnoopGuard APK build successful' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Download the APK from the **Artifacts** section at the bottom of this run.' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Install via USB:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'adb install app-debug.apk' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
