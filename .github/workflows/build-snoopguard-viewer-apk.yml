name: Build SnoopGuard Viewer APK

on:
  push:
    branches: [ main, master, claude/snoopguard-companion-viewer ]
    paths:
      - 'SnoopGuardViewer/**'
      - '.github/workflows/build-snoopguard-viewer-apk.yml'
  pull_request:
    paths:
      - 'SnoopGuardViewer/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make gradlew executable
        working-directory: SnoopGuardViewer
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: SnoopGuardViewer
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: SnoopGuardViewer
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snoopguard-viewer-debug-apk
          path: SnoopGuardViewer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
